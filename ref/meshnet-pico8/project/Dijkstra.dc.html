<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #000000; font-family: 'Silkscreen', ui-monospace, monospace; -webkit-font-smoothing: none; }
    button { font-family: 'Silkscreen', ui-monospace, monospace; cursor: pointer; }
    a { color: #00E436; } a:hover { color: #008751; }
  </style>
</helmet>
<div style="width: 512px; height: 512px; box-sizing: border-box; background: #000000; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; width: 512px; height: 40px; box-sizing: border-box; border-bottom: 4px solid #008751; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;">
    <div style="font-size: 16px; color: #00E436;">DIJKSTRA <span style="color: #008751;">// ROUTE SOLVER</span></div>
    <div style="font-size: 16px; color: #008751;">STEP {{step}}/6</div>
  </div>

  <div style="position: absolute; left: 0; top: 40px; width: 512px; height: 256px;">
    <svg width="512" height="256" viewBox="0 0 512 256" shape-rendering="crispEdges" style="position: absolute; left: 0; top: 0;">
      <defs>
        <pattern id="dots2" width="64" height="64" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="4" height="4" fill="#008751"></rect>
        </pattern>
      </defs>
      <rect x="0" y="0" width="512" height="256" fill="url(#dots2)"></rect>

      <line x1="48" y1="140" x2="150" y2="52" stroke="{{eAB.s}}" stroke-width="4" stroke-dasharray="{{eAB.d}}"></line>
      <line x1="48" y1="140" x2="208" y2="228" stroke="{{eAC.s}}" stroke-width="4" stroke-dasharray="{{eAC.d}}"></line>
      <line x1="150" y1="52" x2="356" y2="60" stroke="{{eBF.s}}" stroke-width="4" stroke-dasharray="{{eBF.d}}"></line>
      <line x1="150" y1="52" x2="252" y2="152" stroke="{{eBD.s}}" stroke-width="4" stroke-dasharray="{{eBD.d}}"></line>
      <line x1="252" y1="152" x2="356" y2="60" stroke="{{eDF.s}}" stroke-width="4" stroke-dasharray="{{eDF.d}}"></line>
      <line x1="252" y1="152" x2="452" y2="176" stroke="{{eDE.s}}" stroke-width="4" stroke-dasharray="{{eDE.d}}"></line>
      <line x1="356" y1="60" x2="452" y2="176" stroke="{{eFE.s}}" stroke-width="4" stroke-dasharray="{{eFE.d}}"></line>
      <line x1="208" y1="228" x2="452" y2="176" stroke="{{eCE.s}}" stroke-width="4" stroke-dasharray="{{eCE.d}}"></line>
    </svg>

    <div style="position: absolute; left: 82px; top: 92px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">10</div>
    <div style="position: absolute; left: 112px; top: 192px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">15</div>
    <div style="position: absolute; left: 253px; top: 42px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">15</div>
    <div style="position: absolute; left: 188px; top: 106px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">12</div>
    <div style="position: absolute; left: 320px; top: 110px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">1</div>
    <div style="position: absolute; left: 352px; top: 182px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">2</div>
    <div style="position: absolute; left: 420px; top: 112px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">5</div>
    <div style="position: absolute; left: 330px; top: 216px; transform: translate(-50%, -50%); background: #000000; padding: 0 4px; font-size: 16px; color: #008751;">10</div>

    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
      <div style="position: absolute; left: {{n.dleft}}px; top: {{n.dtop}}px; width: 88px; text-align: center; font-size: 16px; color: {{n.dcolor}};"><span style="background: #000000; padding: 0 4px;">{{n.dtext}}</span></div>
    </sc-for>

    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
      <div style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 48px; height: 48px;">
        <sc-if value="{{n.queued}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 0; top: 0; width: 48px; height: 48px; box-sizing: border-box; border: 4px solid #00E436; clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%);"></div>
        </sc-if>
        <div style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%); background: {{n.bg}}; border: 4px solid {{n.bc}}; color: {{n.fg}};">{{n.label}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; top: 296px; width: 512px; height: 216px; box-sizing: border-box; border-top: 4px solid #008751; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; gap: 8px; font-size: 16px;">
      <div style="color: #008751;">VISIT</div>
      <div style="color: #00E436;">{{visited}}</div>
    </div>
    <div style="display: flex; gap: 8px; font-size: 16px;">
      <div style="color: #008751;">QUEUE</div>
      <div style="color: #00E436;">{{queue}}</div>
    </div>
    <div style="display: flex; gap: 8px; font-size: 16px;">
      <div style="color: #008751;">TO CITY</div>
      <div style="color: #00E436;">{{result}}</div>
    </div>
    <div style="margin-top: 2px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; color: #008751; line-height: 1.3;">
      <div>U &lt;- POP-MIN(Q)</div>
      <div>D[V] = MIN( D[V], D[U]+W )</div>
    </div>
    <div style="margin-top: auto; display: flex; gap: 12px;">
      <button onClick="{{next}}" style="flex-grow: 1; height: 44px; font-size: 16px; color: #000000; background: #00E436; border: 4px solid #00E436;">Z &nbsp; STEP</button>
      <button onClick="{{reset}}" style="flex-grow: 1; height: 44px; font-size: 16px; color: #008751; background: #000000; border: 4px solid #008751;">X &nbsp; RESET</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":512,"height":512}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { k: 1 };
  }
  renderVals() {
    var self = this;
    var POS = {
      A: { cx: 48, cy: 140, dtop: 94 },
      B: { cx: 150, cy: 52, dtop: 6 },
      C: { cx: 208, cy: 228, dtop: 182 },
      D: { cx: 252, cy: 152, dtop: 106 },
      E: { cx: 452, cy: 176, dtop: 130 },
      F: { cx: 356, cy: 60, dtop: 14 }
    };
    var G = {
      A: { B: 10, C: 15 },
      B: { A: 10, D: 12, F: 15 },
      C: { A: 15, E: 10 },
      D: { B: 12, E: 2, F: 1 },
      E: { C: 10, D: 2, F: 5 },
      F: { B: 15, D: 1, E: 5 }
    };
    var ids = ['A', 'B', 'C', 'D', 'E', 'F'];
    var INF = Infinity;
    var dist = {};
    var parent = {};
    var done = {};
    var visited = [];
    ids.forEach(function (id) { dist[id] = INF; });
    dist.A = 0;

    var k = this.state.k;
    for (var i = 0; i < k; i++) {
      var u = null;
      ids.forEach(function (id) {
        if (!done[id] && dist[id] !== INF && (u === null || dist[id] < dist[u])) { u = id; }
      });
      if (u === null) { break; }
      done[u] = true;
      visited.push(u);
      var nb = G[u];
      Object.keys(nb).forEach(function (v) {
        if (dist[u] + nb[v] < dist[v]) { dist[v] = dist[u] + nb[v]; parent[v] = u; }
      });
    }

    var nodes = ids.map(function (id) {
      var p = POS[id];
      var isDone = !!done[id];
      var reached = dist[id] !== INF;
      var bg = isDone ? '#00E436' : (reached ? '#008751' : '#000000');
      var fg = isDone ? '#000000' : (reached ? '#00E436' : '#008751');
      var bc = isDone ? '#00E436' : (reached ? '#008751' : '#008751');
      return {
        id: id, label: id,
        left: p.cx - 24, top: p.cy - 24,
        dleft: p.cx - 44, dtop: p.dtop,
        dtext: 'd' + (reached ? dist[id] : 'INF'),
        dcolor: isDone ? '#00E436' : (reached ? '#00E436' : '#008751'),
        bg: bg, fg: fg, bc: bc,
        queued: reached && !isDone
      };
    });

    var edgeStyle = function (a, b, weak) {
      var tree = parent[b] === a || parent[a] === b;
      return { s: tree ? '#00E436' : '#008751', d: weak ? '8 8' : '0' };
    };

    var pending = ids.filter(function (id) { return !done[id] && dist[id] !== INF; });
    pending.sort(function (a, b) { return dist[a] - dist[b]; });
    var queue = pending.length ? pending.map(function (id) { return id + dist[id]; }).join(' ') : 'EMPTY';

    var result;
    if (dist.E === INF) {
      result = 'INF';
    } else {
      var chain = ['E'];
      var cur = 'E';
      while (parent[cur]) { cur = parent[cur]; chain.unshift(cur); }
      result = dist.E + ' VIA ' + chain.join('>');
    }

    return {
      nodes: nodes,
      step: k,
      visited: visited.length ? visited.join(' ') : '-',
      queue: queue,
      result: result,
      eAB: edgeStyle('A', 'B', false),
      eAC: edgeStyle('A', 'C', true),
      eBF: edgeStyle('B', 'F', true),
      eBD: edgeStyle('B', 'D', false),
      eDF: edgeStyle('D', 'F', false),
      eDE: edgeStyle('D', 'E', false),
      eFE: edgeStyle('F', 'E', false),
      eCE: edgeStyle('C', 'E', false),
      next: function () { self.setState({ k: Math.min(self.state.k + 1, 6) }); },
      reset: function () { self.setState({ k: 1 }); }
    };
  }
}
</script>
</body>
</html>
